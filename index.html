<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mario Maderas — Precio</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Barlow', sans-serif;
    background: #f0f2f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.12);
  }
  /* HEADER */
  .header {
    background: #2222CC;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header img { max-height: 40px; max-width: 140px; object-fit: contain; }
  .header-txt { color: #fff; }
  .header-txt .marca { font-family:'Barlow Condensed',sans-serif; font-size:1.3rem; font-weight:800; letter-spacing:0.03em; }
  .header-txt .sub { font-size:0.65rem; font-weight:500; opacity:0.75; text-transform:uppercase; letter-spacing:0.08em; }

  /* BODY */
  .body { flex:1; padding: 20px 20px 0; display:flex; flex-direction:column; gap:14px; }

  /* ESTADO */
  .estado { text-align:center; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .estado-icono { font-size:2.5rem; }
  .estado-txt { font-size:1rem; color:#5d6d7e; font-weight:500; }
  .spinner {
    width:40px; height:40px;
    border:4px solid #E8E8FF;
    border-top-color:#2222CC;
    border-radius:50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* NOMBRE */
  .nombre {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #2222CC;
    line-height: 1.15;
  }

  /* PRECIO */
  .precio-bloque {
    background: rgba(93,201,168,0.12);
    border: 1.5px solid rgba(93,201,168,0.4);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .precio-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #2222CC;
    opacity: 0.75;
  }
  .precio-valor {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 3rem;
    font-weight: 800;
    color: #5DC9A8;
    line-height: 1;
    margin-top: 2px;
  }
  .precio-iva { font-size:0.7rem; color:#5d6d7e; margin-top:4px; }
  .precio-sin-iva { font-size:0.7rem; color:#2222CC; margin-top:6px; padding-top:6px; border-top:1px solid rgba(34,34,204,0.1); opacity:0.8; }

  /* DATOS */
  .datos { display:flex; flex-direction:column; gap:6px; }
  .dato {
    display:flex; justify-content:space-between; align-items:center;
    padding: 8px 12px;
    background: rgba(34,34,204,0.05);
    border-radius: 8px;
  }
  .dato-k { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:#2222CC; opacity:0.6; }
  .dato-v { font-size:0.88rem; font-weight:600; color:#2222CC; }

  /* BOTÓN FICHA */
  .btn-ficha {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    background: #2222CC;
    color: #5DC9A8;
    border-radius: 10px;
    text-decoration: none;
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    transition: opacity 0.2s;
  }
  .btn-ficha:hover { opacity: 0.85; }

  /* PROMOCIONES */
  .promo-bloque {
    border-radius: 10px;
    overflow: hidden;
    border: 1.5px solid rgba(93,201,168,0.35);
  }
  .promo-titulo {
    background: rgba(93,201,168,0.22);
    padding: 8px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    color: #2222CC;
    letter-spacing: 0.04em;
  }
  .promo-lista { padding: 10px 14px; display:flex; flex-direction:column; gap:6px; }
  .promo-item { display:flex; align-items:flex-start; gap:8px; font-size:0.82rem; color:#2222CC; line-height:1.35; }
  .promo-check { color:#5DC9A8; font-weight:700; flex-shrink:0; margin-top:1px; }

  /* ANIMACIONES */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes pricePop {
    0%   { transform: scale(0.85); opacity:0; }
    70%  { transform: scale(1.04); }
    100% { transform: scale(1);    opacity:1; }
  }
  .anim-fade  { animation: fadeUp 0.45s ease both; }
  .anim-fade-2 { animation: fadeUp 0.45s ease 0.1s both; }
  .anim-fade-3 { animation: fadeUp 0.45s ease 0.2s both; }
  .anim-fade-4 { animation: fadeUp 0.45s ease 0.3s both; }
  .precio-valor { animation: pricePop 0.5s cubic-bezier(.17,.67,.35,1.2) 0.15s both; }

  /* BADGE ACTUALIZADO */
  .badge-actualizado {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(93,201,168,0.15);
    border: 1px solid rgba(93,201,168,0.4);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.65rem;
    font-weight: 700;
    color: #5DC9A8;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .badge-dot {
    width: 6px; height: 6px;
    background: #5DC9A8;
    border-radius: 50%;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.7); }
  }

  /* PRECIO mejorado */
  .precio-bloque {
    background: linear-gradient(135deg, rgba(93,201,168,0.10) 0%, rgba(93,201,168,0.18) 100%);
    border: 1.5px solid rgba(93,201,168,0.45);
    border-radius: 16px;
    padding: 20px 20px 16px;
    position: relative;
    overflow: hidden;
  }
  .precio-bloque::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(93,201,168,0.18) 0%, transparent 70%);
    border-radius: 50%;
  }
  .precio-valor {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 3.6rem;
    font-weight: 800;
    color: #5DC9A8;
    line-height: 1;
    margin-top: 2px;
    letter-spacing: -0.01em;
  }

  /* PROMOS mejoradas */
  .promo-bloque {
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid rgba(93,201,168,0.35);
    background: linear-gradient(135deg, rgba(93,201,168,0.06) 0%, rgba(34,34,204,0.04) 100%);
  }
  .promo-titulo {
    background: rgba(93,201,168,0.22);
    padding: 10px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    color: #2222CC;
    letter-spacing: 0.04em;
  }
  .promo-item {
    display:flex; align-items:flex-start; gap:10px;
    font-size:0.88rem; color:#2222CC; line-height:1.4;
    padding: 7px 0;
    border-bottom: 1px solid rgba(34,34,204,0.06);
  }
  .promo-item:last-child { border-bottom: none; }
  .promo-check {
    width: 20px; height: 20px;
    background: #5DC9A8;
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem;
    font-weight: 900;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* NOMBRE mejorado */
  .nombre {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: #2222CC;
    line-height: 1.15;
    letter-spacing: 0.01em;
  }

  /* FOOTER */
  .footer {
    padding: 14px 20px;
    font-size:0.65rem;
    text-align:center;
    color:#2222CC;
    opacity:0.5;
    border-top: 1px solid rgba(34,34,204,0.08);
    margin-top:16px;
  }
</style>
</head>
<body>
<div class="card">

  <div class="header">
    <img src="logo.png" alt="Mario Maderas" onerror="this.style.display='none';document.getElementById('headerTxt').style.display='block'">
    <div class="header-txt" id="headerTxt" style="display:none">
      <div class="marca">Mario Maderas</div>
      <div class="sub">Maderería &amp; Ferretería</div>
    </div>
  </div>

  <div class="body" id="cuerpo">
    <div class="estado" id="estadoCarga">
      <div class="spinner"></div>
      <div class="estado-txt">Buscando precio...</div>
    </div>
  </div>

  <div class="footer" id="pie" style="display:none">
    Precio actualizado: <span id="fechaActualizado"></span> • mariomaderas.com
  </div>

</div>

<script>
// ── CONFIGURACIÓN ─────────────────────────────────────
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfxv4fw15ouak9MSPY-0GXV9SxovhO4z-_SFq3fCRR93CRPsjer1rUtu0iwpfMOZ9xEg/exec';

// Promociones — editá este texto cuando quieras
var PROMO_TITULO = '🎉 Promociones vigentes';
var PROMOS = [
  '3 cuotas sin interés con Naranja X',
  '10% descuento pagando en efectivo',
  'Envío gratis en compras mayores a $50.000'
];
// ─────────────────────────────────────────────────────

function formatPrecio(n) {
  return '$ ' + parseFloat(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function mostrarError(msg) {
  document.getElementById('cuerpo').innerHTML =
    '<div class="estado"><div class="estado-icono">⚠️</div><div class="estado-txt">' + msg + '</div></div>';
}

async function cargarConfig() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000); // 3 segundos máximo
    const res = await fetch(APPS_SCRIPT_URL + '?action=config&v=' + Date.now(), { signal: controller.signal });
    clearTimeout(timeout);
    const data = await res.json();
    if (data.ok && data.config) {
      CONFIG = data.config;
      aplicarColores();
      if (CONFIG.promoTitulo) PROMO_TITULO = CONFIG.promoTitulo;
      if (CONFIG.promoTexto) PROMOS = CONFIG.promoTexto.split('\n').filter(l => l.trim());
    }
  } catch(e) {
    console.log('Config no disponible, usando defaults:', e.message);
  }
  // SIEMPRE continúa — nunca bloquea la carga del producto
}

function aplicarColores() {
  if (CONFIG.colorPrincipal) {
    const header = document.querySelector('.header');
    if (header) header.style.background = CONFIG.colorPrincipal;
  }
  if (CONFIG.colorAcento) {
    const style = document.createElement('style');
    style.textContent = [
      '.precio-valor { color: ' + CONFIG.colorAcento + ' !important; }',
      '.badge-actualizado { color: ' + CONFIG.colorAcento + ' !important; border-color: ' + CONFIG.colorAcento + ' !important; }',
      '.badge-dot { background: ' + CONFIG.colorAcento + ' !important; }',
      '.promo-check { background: ' + CONFIG.colorAcento + ' !important; }',
      '.precio-sin-iva strong { color: ' + CONFIG.colorAcento + '; }'
    ].join('');
    document.head.appendChild(style);
  }
}

async function cargarProducto() {
  var params = new URLSearchParams(window.location.search);
  var cod = params.get('cod');

  if (!cod) {
    mostrarError('No se especificó ningún producto.<br>Escaneá el QR del producto.');
    return;
  }

  try {
    var res = await fetch(APPS_SCRIPT_URL + '?cod=' + encodeURIComponent(cod) + '&v=' + Date.now());
    var data = await res.json();

    if (!data.ok) {
      mostrarError('Producto no encontrado.<br>Código: ' + cod);
      return;
    }

    // Aplicar config que viene junto con el producto
    if (data.config) {
      CONFIG = data.config;
      aplicarColores();
      if (CONFIG.promoTitulo) PROMO_TITULO = CONFIG.promoTitulo;
      if (CONFIG.promoTexto) PROMOS = CONFIG.promoTexto.split('\n').filter(l => l.trim());
    }

    var p = data.producto;
    var html = '';

    // Badge actualizado
    var hoy = new Date().toLocaleDateString('es-AR', {day:'numeric', month:'long'});
    html += '<div class="anim-fade"><span class="badge-actualizado"><span class="badge-dot"></span>Precio actualizado · ' + hoy + '</span></div>';

    // Nombre
    html += '<div class="nombre anim-fade">' + p.descripcion + '</div>';

    // Lista determinada por el Sheet (p.lista: 1 o 2), por defecto 2
    var lista = (p.lista === 1) ? 1 : 2;
    var esList2 = (lista === 2);
    var precioConIva = esList2 ? (p.precio_lista2 || p.precio_lista1) : (p.precio_lista1 || p.precio);
    var precioSinIva = esList2 ? p.precio_sin_iva_2 : p.precio_sin_iva_1;
    var nombreLista  = esList2 ? 'Lista 2' : 'Lista 1';

    // Precio
    html += '<div class="precio-bloque anim-fade-2">' +
      '<div class="precio-label">Precio de ' + nombreLista + '</div>' +
      '<div class="precio-valor">' + formatPrecio(precioConIva) + '</div>' +
      '<div class="precio-iva">Precio con IVA incluido</div>' +
      (precioSinIva ? '<div class="precio-sin-iva">Precio sin imp. nacionales: <strong>' + formatPrecio(precioSinIva) + '</strong></div>' : '') +
      '</div>';
    // Close precio block only if shown
    if (!mostrarPrecioF) { html = html; } // already conditional above

    // Campos visibles desde config (0 = oculto, cualquier otro valor = visible)
    const mostrarNombreF = CONFIG.mostrarNombre  !== '0';
    const mostrarPrecioF = CONFIG.mostrarPrecio  !== '0';
    const mostrarCodigo  = CONFIG.mostrarCodigo  !== '0';
    const mostrarFabrica = CONFIG.mostrarFabrica !== '0';
    const mostrarFecha   = CONFIG.mostrarFecha   !== '0';
    const mostrarFicha_  = CONFIG.mostrarFicha   !== '0';
    const mostrarPromo_  = CONFIG.mostrarPromo   !== '0';

    var datosHtml = '';
    if (mostrarCodigo)  datosHtml += '<div class="dato"><span class="dato-k">Código</span><span class="dato-v">' + p.codigo + '</span></div>';
    if (mostrarFabrica) datosHtml += '<div class="dato"><span class="dato-k">Cód. Fábrica</span><span class="dato-v">' + (p.cod_fabrica || '—') + '</span></div>';
    if (datosHtml) html += '<div class="datos anim-fade-3">' + datosHtml + '</div>';

    // Ficha técnica
    if (p.ficha_tecnica && mostrarFicha_) {
      html += '<a href="' + p.ficha_tecnica + '" target="_blank" class="btn-ficha anim-fade-3">📄 Ver ficha técnica</a>';
    }

    // Promociones
    if (PROMOS.length > 0 && mostrarPromo_) {
      html += '<div class="promo-bloque anim-fade-4">' +
        '<div class="promo-titulo">' + PROMO_TITULO + '</div>' +
        '<div class="promo-lista">';
      PROMOS.forEach(function(promo) {
        html += '<div class="promo-item"><div class="promo-check">✓</div><span>' + promo + '</span></div>';
      });
      html += '</div></div>';
    }

    document.getElementById('cuerpo').innerHTML = html;

    // Footer con fecha
    document.getElementById('fechaActualizado').textContent = data.actualizado || '';
    document.getElementById('pie').style.display = 'block';

  } catch(e) {
    // Retry once after 2 seconds
    try {
      await new Promise(r => setTimeout(r, 2000));
      var res2 = await fetch(APPS_SCRIPT_URL + '?cod=' + encodeURIComponent(cod) + '&v=' + Date.now());
      var data2 = await res2.json();
      if (!data2.ok) { mostrarError('Producto no encontrado.<br>Código: ' + cod); return; }
      var p = data2.producto;
      // Re-run display (simplified)
      document.getElementById('cuerpo').innerHTML = '<div class="estado"><div class="estado-icono">✅</div><div class="estado-txt">Producto cargado</div></div>';
      location.reload();
    } catch(e2) {
      mostrarError('Error de conexión.<br>Verificá tu conexión a internet.');
    }
  }
}

cargarProducto();
</script>
</body>
</html>
